<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artists &mdash; HVX Music | Electronic Music Roster</title>
  <meta name="description" content="Meet the HVX Music artist roster. House, tech house, afro house, and melodic house artists from around the world, developed and distributed by HVX Music." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Artists &mdash; HVX Music" />
  <meta property="og:description" content="Meet the HVX Music electronic music artist roster." />
  <meta property="og:url" content="https://hvx-music.netlify.app/artists.html" />
  <link rel="canonical" href="https://hvx-music.netlify.app/artists.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #080808;
      --dark: #0f0f0f;
      --dark-2: #161616;
      --dark-3: #1e1e1e;
      --border: rgba(255,255,255,0.07);
      --white: #fff;
      --off-white: #c8c8c8;
      --muted: #6b6b6b;
      --accent: #a259ff;
      --accent-2: #ff6b35;
      --accent-glow: rgba(162,89,255,0.25);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Manrope', sans-serif;
      cursor: none;
      overflow-x: hidden;
    }

    /* -- SCROLL PROGRESS -- */
    #scroll-progress {
      position: fixed;
      top: 0; left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      z-index: 10000;
      transition: width 0.1s linear;
    }

    /* -- CUSTOM CURSOR -- */
    #cursor-dot {
      position: fixed;
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100001;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, background 0.2s;
    }
    #cursor-ring {
      position: fixed;
      width: 36px; height: 36px;
      border: 1.5px solid rgba(162,89,255,0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100000;
      transform: translate(-50%, -50%);
      transition: transform 0.18s ease, width 0.2s, height 0.2s, border-color 0.2s;
    }
    body.cursor-hover #cursor-dot { transform: translate(-50%,-50%) scale(2); background: var(--accent-2); }
    body.cursor-hover #cursor-ring { width: 54px; height: 54px; border-color: var(--accent-2); }

    /* -- NAV -- */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 104px;
      background: linear-gradient(to bottom,
        rgba(4,4,7,0.97) 0%,
        rgba(4,4,7,0.88) 45%,
        rgba(4,4,7,0.55) 78%,
        rgba(4,4,7,0) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 100%);
    }
    .nav-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      height: 104px;
      overflow: hidden;
    }
    .nav-logo-video {
      height: 440px;
      width: auto;
      display: block;
      object-fit: contain;
      mix-blend-mode: screen;
      mask-image: radial-gradient(ellipse 58% 30% at 50% 50%, #000 45%, transparent 100%); -webkit-mask-image: radial-gradient(ellipse 58% 30% at 50% 50%, #000 45%, transparent 100%);
    }
    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }
    .nav-links a {
      color: var(--off-white);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.2s;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 1px;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--accent); }
    .nav-links a.active::after { width: 100%; }
    .nav-cta {
      background: var(--accent);
      color: var(--white);
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: none;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      text-decoration: none;
    }
    .nav-cta:hover {
      background: var(--accent-2);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(255,107,53,0.35);
    }

    /* -- HERO -- */
    .roster-hero {
      position: relative;
      padding: 140px 48px 48px;
      overflow: hidden;
    }
    .roster-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, var(--accent-glow), transparent 70%);
      pointer-events: none;
    }
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
      animation: scanMove 4s linear infinite;
    }
    @keyframes scanMove {
      0% { top: 0; }
      100% { top: 100%; }
    }
    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
    }
    .hero-label::before {
      content: '';
      display: block;
      width: 24px; height: 1px;
      background: var(--accent);
    }
    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--white);
      margin-bottom: 28px;
    }
    .hero-title em {
      font-style: normal;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.3);
    }
    .hero-sub {
      font-size: 1.1rem;
      color: var(--off-white);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 48px;
    }
    .accent-rule {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      margin-bottom: 52px;
      border-radius: 2px;
    }

    /* -- FILTER BUTTONS -- */
    .filter-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 9px 22px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'Manrope', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: none;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .filter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .filter-btn span { position: relative; z-index: 1; }
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--white);
    }
    .filter-btn.active::before { opacity: 0.2; }
    .filter-btn:hover {
      border-color: rgba(162,89,255,0.5);
      color: var(--white);
    }

    /* -- ARTISTS SECTION -- */
    .artists-section {
      padding: 60px 48px 120px;
    }
    .artists-count {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .artists-count span { color: var(--accent); }

    .artists-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    /* -- ARTIST CARD -- */
    .artist-card {
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      transform-style: preserve-3d;
      will-change: transform;
    }
    body.js-reveal .artist-card {
      opacity: 0;
      transform: translateY(40px);
    }
    body.js-reveal .artist-card.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .artist-card:hover {
      border-color: rgba(162,89,255,0.4);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px var(--accent-glow);
    }

    /* Image area */
    .card-image-wrap {
      position: relative;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--dark-3);
    }
    .card-img-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .card-img-placeholder::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 70%, rgba(162,89,255,0.15) 0%, transparent 50%),
        radial-gradient(circle at 70% 30%, rgba(255,107,53,0.1) 0%, transparent 50%);
    }
    .placeholder-text {
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.1);
      writing-mode: vertical-rl;
      text-orientation: upright;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }
    /* Noise overlay */
    .card-img-placeholder::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
    }

    /* Hover overlay */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 30%, rgba(8,8,8,0.95) 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 28px;
      gap: 14px;
    }
    .artist-card:hover .card-overlay { opacity: 1; }

    .overlay-socials {
      display: flex;
      gap: 12px;
    }
    .social-icon {
      width: 36px; height: 36px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--off-white);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .social-icon:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--white);
    }
    .view-profile-btn {
      padding: 10px 28px;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: none;
      transition: background 0.2s, transform 0.15s;
      display: inline-block;
      width: 100%;
      text-align: center;
    }
    .view-profile-btn:hover {
      background: var(--accent-2);
      transform: translateY(-1px);
    }

    /* Card info */
    .card-info {
      padding: 20px 22px 24px;
    }
    .genre-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .genre-tag.house { background: rgba(162,89,255,0.15); color: var(--accent); border: 1px solid rgba(162,89,255,0.3); }
    .genre-tag.tech-house { background: rgba(255,107,53,0.12); color: var(--accent-2); border: 1px solid rgba(255,107,53,0.25); }
    .genre-tag.dance { background: rgba(0,210,150,0.1); color: #00d296; border: 1px solid rgba(0,210,150,0.25); }

    .card-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 4px;
    }
    .card-city {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-city::before {
      content: '';
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .card-bio {
      font-size: 0.82rem;
      color: var(--off-white);
      line-height: 1.65;
      opacity: 0.8;
    }

    /* -- FOOTER -- */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--white);
      text-decoration: none;
    }
    .footer-logo span { color: var(--accent); }
    .footer-copy {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .footer-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }
    .footer-links a {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--white); }

    /* -- RIPPLE -- */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(162,89,255,0.3);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    /* -- HIDDEN -- */
    .artist-card.hidden { display: none; }

    @media (max-width: 1024px) {
      .artists-grid { grid-template-columns: repeat(2, 1fr); }
      nav { padding: 0 24px; }
      .roster-hero, .artists-section { padding-left: 24px; padding-right: 24px; }
    }
    @media (max-width: 640px) {
      .artists-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .hero-title { font-size: 3.5rem; }
    }
  </style>
</head>
<body>

  <div id="scroll-progress"></div>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">
      <video src="assets/hvx-logo-anim.mp4" autoplay muted loop playsinline class="nav-logo-video" aria-label="HVX Music"></video>
    </a>
    <ul class="nav-links">
      <li><a href="artists.html" class="active">Artists</a></li>
      <li><a href="index.html#about">About</a></li>

      <li><a href="index.html#releases">Releases</a></li>
      <li><a href="index.html#demo">Demos</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="roster-hero">
    <div class="scan-line"></div>
    <div class="hero-label">HVX Music Group</div>
    <h1 class="hero-title">THE<br><em>ROSTER</em></h1>
    <div class="accent-rule"></div>
    <p class="hero-sub">A curated collective of boundary-pushing selectors &amp; producers. Six artists. One vision.</p>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all"><span>All</span></button>

  <!-- ARTISTS GRID -->
  <section class="artists-section">

  <!-- FOOTER -->
  <footer>

    <ul class="footer-links">
      <li><a href="#">Privacy</a></li>

      <li><a href="index.html#contact">Contact</a></li>

  <script src="hvx-config.js"></script>
  <script>
  /* Demos points at the same TrackStack link the rest of the site uses.
     This page loads no bundle, so it reads the config directly. */
  (function () {
    var url = (window.HVX_CONFIG && window.HVX_CONFIG.demos
      && window.HVX_CONFIG.demos.trackstack) || '';
    var link = document.querySelector('.nav-links a[href$="#demo"]');
    if (!link) return;
    if (!url) { link.parentNode.hidden = true; return; }
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
  })();
  </script>
  <script>
(async () => {
    // CURSOR
    const dot = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    function animateCursor() {
      dot.style.left = mx + 'px'; dot.style.top = my + 'px';
      rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
      ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
    document.querySelectorAll('a, button, .artist-card').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
    });

    // SCROLL PROGRESS
    const prog = document.getElementById('scroll-progress');
    window.addEventListener('scroll', () => {
      const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
      prog.style.width = pct + '%';
    });

    // RENDER ARTISTS - server data first, localStorage as fallback
    const grid = document.getElementById('artists-grid');
    const countEl = document.getElementById('visible-count');
    let artistData = [];
    try {
      const res = await Promise.race([
        fetch('/api/data?key=artists').then(r => r.ok ? r.json() : null),
        new Promise(res => setTimeout(() => res(null), 2500))
      ]);
      if (Array.isArray(res) && res.length) {
        artistData = res;
        localStorage.setItem('hvx_artists', JSON.stringify(res));
      }
    } catch(e) {}
    if (!artistData.length) {
      const storedArtists = (() => { try { return JSON.parse(localStorage.getItem('hvx_artists') || 'null'); } catch(e) { return null; } })();
      artistData = (storedArtists && storedArtists.length) ? storedArtists : [];
    }

    function genreClass(g) {
      if (!g) return '';
      const s = g.toLowerCase();
      if (s.includes('tech')) return 'tech-house';
      if (s.includes('afro')) return 'afro-house';
      if (s.includes('house')) return 'house';
      return 'dance';
    }

    if (artistData.length) {
      artistData.forEach(a => {
        const imgHTML = a.photo
          ? `<img src="${a.photo}" alt="${a.name}" style="width:100%;height:100%;object-fit:cover;">`
          : `<div class="card-img-placeholder"><span class="placeholder-text">${a.name.toUpperCase()}</span></div>`;
        const art = document.createElement('article');
        art.className = 'artist-card';
        art.dataset.genre = a.genre || '';
        const artistId = (a.id || a.name.toLowerCase().replace(/\s+/g,'-'));
        art.innerHTML = `
          <div class="card-image-wrap">
            ${imgHTML}
            <div class="card-overlay">
              <div class="overlay-socials">
                ${a.social && a.social.instagram && a.social.instagram !== '#' ? `<a href="${a.social.instagram}" target="_blank" class="social-icon">IG</a>` : ''}
                ${a.social && a.social.soundcloud && a.social.soundcloud !== '#' ? `<a href="${a.social.soundcloud}" target="_blank" class="social-icon">SC</a>` : ''}
                ${a.social && a.social.spotify && a.social.spotify !== '#' ? `<a href="${a.social.spotify}" target="_blank" class="social-icon">SP</a>` : ''}
              </div>
              <a href="artist-profile.html?id=${artistId}" class="view-profile-btn">View Profile</a>
            </div>
          </div>
          <div class="card-info">
            <span class="genre-tag ${genreClass(a.genre)}">${a.genre || ''}</span>
            <h2 class="card-name">${a.name.toUpperCase()}</h2>
            <div class="card-city">${a.city || 'TBA'}</div>
            <p class="card-bio">${a.bio || ''}</p>
          </div>`;
        grid.appendChild(art);
      });
      countEl.textContent = artistData.length;
    } else {
      grid.innerHTML = '<p style="color:var(--muted);font-size:.9rem;grid-column:1/-1;text-align:center;padding:3rem 0">No artists on the roster yet.</p>';
      countEl.textContent = '0';
    }

    // FILTER
    const filterBtns = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.artist-card');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        let visible = 0;
        cards.forEach(card => {
          const match = filter === 'all' || card.dataset.genre === filter;
          card.classList.toggle('hidden', !match);
          if (match) visible++;
        });
        countEl.textContent = visible;
      });
    });

    // SCROLL REVEAL
    document.body.classList.add('js-reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 80);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
    cards.forEach(c => observer.observe(c));

    // 3D TILT
    cards.forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        card.style.transform = `perspective(800px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg) translateY(-4px)`;
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = '';
      });
    });

    // RIPPLE
    document.querySelectorAll('button, .view-profile-btn, .nav-cta').forEach(el => {
      el.addEventListener('click', e => {
        const r = document.createElement('span');
        r.classList.add('ripple');
        const rect = el.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
        el.style.position = 'relative';
        el.style.overflow = 'hidden';
        el.appendChild(r);
        setTimeout(() => r.remove(), 600);
      });
    });
  })();
</script>
</body>
</html>
